# Hall Ledger on Netlify.
# Set DATABASE_URL (Supabase transaction pooler, port 6543, ?pgbouncer=true&connection_limit=1),
# DIRECT_URL (Supabase direct/session connection, port 5432), APP_URL, SESSION_SECRET
# and SMTP_* in the Netlify UI. See docs/operations.md.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  TRUST_PROXY = "1"

[dev]
  command = "npm run dev"
  targetPort = 3000
